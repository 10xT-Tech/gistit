# EnglishHelper — xcodegen project definition (source of truth for the Xcode project).
# Regenerate the .xcodeproj with:  xcodegen generate
# The generated EnglishHelper.xcodeproj is gitignored; project.yml is committed instead.
#
# Clean Architecture as separate framework modules — the dependency rule is enforced by the
# compiler (Domain literally cannot import outer layers):
#   Domain  ◄── Data
#   Domain  ◄── Presentation ──► DesignSystem
#   (App depends on everything; nothing depends on App)

name: EnglishHelper

options:
  bundleIdPrefix: tech.10xt
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  # Bump LastUpgradeCheck to the current Xcode so the IDE doesn't nag "Update to recommended
  # settings" (xcodegen hardcodes 1430). Runs after the project is written.
  postGenCommand: sed -i '' -E 's/LastUpgradeCheck = [0-9]+;/LastUpgradeCheck = 2700;/' EnglishHelper.xcodeproj/project.pbxproj

# Common build settings for every target.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.5.0"        # user-visible version — bump for a new release
    CURRENT_PROJECT_VERSION: "3"      # build number — MUST be unique per App Store upload; bump every upload
    # Frameworks let Xcode synthesize their Info.plist; the app overrides with an explicit file.
    GENERATE_INFOPLIST_FILE: "YES"
    # Device signing for every target (the app + the embedded ShareExtension both need a team for the
    # App Group capability). Pinned here so a regenerated project keeps the team instead of dropping it.
    # Simulator builds ignore this (ad-hoc). Override the team in Secrets.xcconfig if it ever changes.
    DEVELOPMENT_TEAM: TQJ35ER433
    CODE_SIGN_STYLE: Automatic
    # iPhone-ONLY: no Mac Catalyst, no Mac "Designed for iPhone", no Apple Vision — project-wide.
    # NOTE: TARGETED_DEVICE_FAMILY ("1" = iPhone, no iPad) is pinned PER-TARGET on EVERY target
    # instead — xcodegen injects a per-target "1,2" default that overrides a project-level value, so it
    # must live on each shippable target to win.
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    # Xcode "recommended settings" — pinned HERE (not via Xcode's "Perform Changes", which a regenerate
    # would wipe). Sandbox build-phase scripts; verify the frameworks' clang modules import cleanly.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    MODULE_VERIFIER_SUPPORTED_LANGUAGES: "objective-c objective-c++"
    MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"

# Layer the (gitignored) Secrets.xcconfig in via an optional include, so generation/build never
# fails when secrets are absent (e.g. a fresh clone or CI).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

# SPM dependencies. Amplitude (product analytics — no ATT/IDFA; EU data center) is linked into
# the Adapters framework ONLY: the SDK is static, so linking it into a second image (the app)
# would duplicate it; the composition root creates it via `AmplitudeTracker(apiKey:)`.
# Sentry (crash & error reporting) follows the same rule — static, Adapters only, started via
# `SentryCrashReporter.start(dsn:)`.
# EXCEPTION: Amplitude's own dependency AmplitudeCore ships as a prebuilt DYNAMIC xcframework.
# Xcode does not embed a framework target's transitive dynamic binaries into the app, so the app
# links it directly (`AmplitudeCoreFramework` below), which makes Xcode embed it. Without that, dyld
# kills the app at launch on a device ("Library not loaded: @rpath/AmplitudeCore.framework"). The
# Simulator hides the problem because Xcode resolves frameworks from the build folder there.
packages:
  Amplitude:
    url: https://github.com/amplitude/Amplitude-Swift
    from: 1.19.3
  AmplitudeCore:
    url: https://github.com/amplitude/AmplitudeCore-Swift
    from: 1.5.3
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.30.1

targets:

  Domain:
    type: framework
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only — overrides xcodegen's per-target "1,2" default
    sources: [Domain]

  # Module is named `Adapters` (not `Data`) so it never shadows Foundation.Data in consumers.
  # The on-disk folder stays `Data/` per the layer layout.
  Adapters:
    type: framework
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only — overrides xcodegen's per-target "1,2" default
    sources: [Data]
    dependencies:
      - target: Domain
      - package: Amplitude
        product: AmplitudeSwift
      - package: Sentry
        product: Sentry

  DesignSystem:
    type: framework
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only — overrides xcodegen's per-target "1,2" default
    sources: [DesignSystem]

  Presentation:
    type: framework
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only — overrides xcodegen's per-target "1,2" default
    sources: [Presentation]
    dependencies:
      - target: Domain
      - target: DesignSystem

  EnglishHelper:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: Domain
      - target: Adapters
      - target: DesignSystem
      - target: Presentation
      # Dynamic binary used by Adapters (Amplitude). Linking it from the app makes Xcode embed it;
      # an explicit `embed: true` breaks the build ("AmplitudeCoreFramework-product" not found).
      - package: AmplitudeCore
        product: AmplitudeCoreFramework
      - target: ShareExtension   # embedded into the app's PlugIns (auto-embed for app-extension deps)
      - target: LockWidgets      # Lock Screen WidgetKit extension — auto-embedded into PlugIns too
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.10xt.englishhelper
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/EnglishHelper.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only — overrides xcodegen's per-target "1,2" default
        ENABLE_PREVIEWS: YES

  # iOS Share-sheet target: receives images/text from the system share sheet and hands them to the
  # app via the App Group (`Shared/SharedInbox.swift`, compiled into both targets).
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.10xt.englishhelper.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only — overrides xcodegen's per-target "1,2" default

  # Lock Screen WidgetKit extension: three accessoryCircular widgets that deep-link into scenarios via
  # the englishhelper:// scheme. app-extension is the right XcodeGen type — what makes it a WIDGET is the
  # Info.plist NSExtensionPointIdentifier (com.apple.widgetkit-extension), not the target type. Static
  # launchers, so NO entitlements / App Group needed. Team + deployment target inherit from settings.base.
  LockWidgets:
    type: app-extension
    platform: iOS
    # Shared/LiveTranslationActivity.swift (ONLY that file, not the whole Shared/ folder) is compiled
    # into BOTH the app and this extension: Live Activity attributes and intents must be the same
    # type name + encoding on both sides of the process boundary.
    sources:
      - LockWidgets
      - Shared/LiveTranslationActivity.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.10xt.englishhelper.LockWidgets
        INFOPLIST_FILE: LockWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only — overrides xcodegen's per-target "1,2" default

  EnglishHelperTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only — overrides xcodegen's per-target "1,2" default
    sources: [Tests, Shared]   # Shared/SharedInbox.swift is exercised by SharedInboxTests
    dependencies:
      - target: Domain
      - target: Adapters
      - target: Presentation

  # XCUITest bundle: launches the real app with `-uiTestStubs` (deterministic stub adapters with a
  # visible latency + in-memory repositories) and drives it through the tab-switching scenarios that
  # must preserve each screen's state (results / input / mode / tone).
  EnglishHelperUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only — overrides xcodegen's per-target "1,2" default
    sources: [UITests]
    dependencies:
      - target: EnglishHelper

schemes:
  # Default dev-loop scheme: UNIT tests only, so `xcodebuild test -scheme EnglishHelper` stays a
  # seconds-long check. The XCUI suite (5 full app launches with latency stubs) lives in its own
  # scheme below — run it explicitly: `xcodebuild test -scheme EnglishHelperUITests …`.
  EnglishHelper:
    build:
      targets:
        EnglishHelper: all
        EnglishHelperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EnglishHelperTests

  EnglishHelperUITests:
    build:
      targets:
        EnglishHelper: all
        EnglishHelperUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EnglishHelperUITests
